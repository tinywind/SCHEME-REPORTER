version: 2
updates:
- package-ecosystem: gradle
  directory: /scheme-reporter-gradle-plugin
  schedule:
    interval: weekly
    day: monday
    time: 03:00
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 03:00
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
