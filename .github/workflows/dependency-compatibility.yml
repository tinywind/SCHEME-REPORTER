name: Dependency compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-serialization-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - name: Install current Maven artifacts locally
        shell: cmd
        run: mvn -B -ntp -DskipTests -Dgpg.skip=true install
      - name: Verify existing and inherited JVM policies
        working-directory: scheme-reporter-gradle-plugin
        run: python ../.github/scripts/check-wrapper-environment.py .
      - name: Verify the Windows bootstrap with delayed expansion enabled
        working-directory: scheme-reporter-gradle-plugin
        shell: pwsh
        run: |
          & cmd.exe /d /e:on /v:on /c ".\gradlew.bat test --tests org.tinywind.ShadedGuavaSerializationTest --max-workers=2 --stacktrace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows wrapper failure propagation
        working-directory: scheme-reporter-gradle-plugin
        shell: pwsh
        run: |
          & cmd.exe /d /e:on /v:on /c ".\gradlew.bat --unknown-scheme-reporter-option"
          if ($LASTEXITCODE -eq 0) { throw "The wrapper lost the failing Java exit code" }
          $global:LASTEXITCODE = 0
